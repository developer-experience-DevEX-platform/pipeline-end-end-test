name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    uses: developer-experience-DevEX-platform/ci-cd-templates/.github/workflows/nodejs-ci.yml@refactor/ci-fixed-contract
    secrets: inherit
    with:
      has_integration_tests: true

  container-validation:
    if: github.event_name == 'pull_request'
    needs: ci
    permissions:
      contents: read
    uses: developer-experience-DevEX-platform/ci-cd-templates/.github/workflows/container-release.yml@refactor/ci-fixed-contract
