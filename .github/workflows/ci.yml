name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
    uses: developer-experience-DevEX-platform/ci-cd-templates/.github/workflows/nodejs-ci.yml@main
    with:
      working_directory: .
      dockerfile_path: ./Dockerfile
      node_version: '24'
      has_integration_tests: true
      integration_test_command: npm run test:integration
      integration_test_secret_source: aws-secrets-manager
      integration_test_secret_mapping: |
        [
          {
            "env": "TEST_TOKEN",
            "secret_id": "arn:aws:secretsmanager:eu-west-2:980829302319:secret:pipeline-end-end-test/integration-0nxavk",
            "json_key": "test_token"
          }
        ]

  container-validation:
    if: github.event_name == 'pull_request'
    needs: ci
    permissions:
      contents: read
      id-token: write
    uses: developer-experience-DevEX-platform/ci-cd-templates/.github/workflows/container-release.yml@main
    with:
      working_directory: .
      dockerfile_path: Dockerfile
      image_name: ${{ github.event.repository.name }}
      image_tag: ${{ github.sha }}
      publish_image: false
