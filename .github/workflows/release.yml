name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: developer-experience-DevEX-platform/ci-cd-templates/.github/workflows/nodejs-ci.yml@main
    with:
      working_directory: .
      dockerfile_path: ./Dockerfile
      node_version: '24'
      has_integration_tests: false

  release:
    if: ${{ vars.AWS_REGION != '' && vars.AWS_RELEASE_ROLE_ARN != '' && vars.ECR_REPOSITORY != '' }}
    needs: ci
    permissions:
      contents: read
      id-token: write
    uses: developer-experience-DevEX-platform/ci-cd-templates/.github/workflows/container-release.yml@main
    with:
      working_directory: .
      dockerfile_path: Dockerfile
      image_name: ${{ github.event.repository.name }}
      image_tag: ${{ github.sha }}
      publish_image: true

  deploy-staging:
    name: Deploy to staging
    needs: release
    permissions:
      contents: read
    uses: developer-experience-DevEX-platform/ci-cd-templates/.github/workflows/kubernetes-gitops-cd.yml@main
    with:
      service_name: ${{ github.event.repository.name }}
      image_tag: ${{ github.sha }}
      gitops_repository: developer-experience-DevEX-platform/platform-gitops
      gitops_branch: main
    secrets:
      PLATFORM_GITOPS_TOKEN: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
